name: Verify and deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocabulary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify application
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load production target
        run: |
          set -a
          . deploy/production.env
          set +a
          if [[ ! "$DEPLOY_HOST" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "::error title=Invalid production target::DEPLOY_HOST must be an IPv4 address."
            exit 1
          fi
          if [[ ! "$APP_DOMAIN" =~ ^[a-z0-9.-]+$ ]]; then
            echo "::error title=Invalid production target::APP_DOMAIN must be a hostname."
            exit 1
          fi
          printf 'DEPLOY_HOST=%s\nAPP_DOMAIN=%s\n' "$DEPLOY_HOST" "$APP_DOMAIN" >> "$GITHUB_ENV"

      - name: Report missing deployment secrets
        if: env.DEPLOY_SSH_KEY == '' || env.DEPLOY_KNOWN_HOSTS == ''
        run: echo "Verification passed; deployment is skipped until production secrets are configured."

      - name: Configure SSH
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_KNOWN_HOSTS != ''
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/vocabulary_deploy_key"
          chmod 600 "$RUNNER_TEMP/vocabulary_deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/vocabulary_deploy_key" > /dev/null 2>&1; then
            echo "::error title=Invalid DEPLOY_SSH_KEY::Replace the secret with the complete private key, including its header and footer."
            exit 1
          fi
          if ! ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null; then
            echo "::error title=Invalid DEPLOY_KNOWN_HOSTS::Replace the secret with the complete ssh-keyscan output for $DEPLOY_HOST."
            exit 1
          fi

      - name: Deploy production
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_KNOWN_HOSTS != ''
        run: |
          ssh -i "$RUNNER_TEMP/vocabulary_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            root@"$DEPLOY_HOST" \
            'cd /root/TheVocabularyApp/the-vocabulary-app-web &&
             git pull --ff-only origin main &&
             docker compose --env-file .env --env-file deploy/production.env -f deploy/compose.yml up -d --build --remove-orphans &&
             docker compose --env-file .env --env-file deploy/production.env -f deploy/compose.yml ps'
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 \
            "https://${APP_DOMAIN}/api/config" > /dev/null
